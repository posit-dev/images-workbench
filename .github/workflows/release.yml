name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Product version (e.g. 2026.02.1+500.pro12)"
        required: true
        type: string


jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    uses: posit-dev/images-shared/.github/workflows/product-release.yml@main
    with:
      version: ${{ inputs.version }}
      images: "workbench workbench-session-init"
    secrets:
      CLIENT_ID: ${{ secrets.WORKBENCH_IDE_RELEASE_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.WORKBENCH_IDE_RELEASE_PEM }}

  trigger-specialized:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.WORKBENCH_IDE_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.WORKBENCH_IDE_RELEASE_PEM }}
          owner: posit-dev
          repositories: images-specialized

      - name: Trigger images-specialized release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run release.yml \
            --repo posit-dev/images-specialized \
            --ref main \
            -f version="$VERSION"
