name: Production
on:
  workflow_dispatch:

  schedule:
    # Weekly rebuild of all images, to pick up any upstream changes.
    - cron: "15 3 * * 0" # At 03:15 on Sunday

  push:
    branches:
      - main


# Production and session image builds share a concurrency group so only one
# of these workflows can run at a time.
concurrency:
  group: workbench-image-build

jobs:
  ci:
    name: CI
    # This should be the only action checked as required in the repo settings.
    #
    # This is a meta-job, here to express the conditions we require
    # in order to consider a CI run to be successful.
    if: always()

    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    needs:
      - build
      - update-helm

    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        id: alls-green
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: update-helm
      - if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: posit-dev/images-shared/.github/actions/slack-build-notify@main
        with:
          result: ${{ steps.alls-green.outcome }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Jobs that call a reusable workflow via `uses:` can't also set
  # `environment:`, so the branch restriction lives in its own job and
  # build depends on it.
  main-only:
    name: Main Only
    runs-on: ubuntu-latest
    permissions: {}
    environment: production
    steps:
      - run: echo "Branch allowed by environment policy."

  build:
    name: Build
    # Build all images, excluding dev versions.
    #
    # Builds all versions of each image in parallel.
    #
    # Run on merges to main, or on weekly scheduled re-builds.
    needs:
      - main-only
    permissions:
      contents: read
      packages: write
      id-token: write

    uses: "posit-dev/images-shared/.github/workflows/bakery-build-native.yml@main"
    secrets:
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      DOCKER_HUB_README_USERNAME: ${{ secrets.DOCKER_HUB_README_USERNAME }}
      DOCKER_HUB_README_PASSWORD: ${{ secrets.DOCKER_HUB_README_PASSWORD }}
      AWS_ROLE: ${{ secrets.AWS_ROLE }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      WIZ_POLICY_ID: ${{ secrets.WIZ_POLICY_ID }}
      WIZ_PROJECT_ID: ${{ secrets.WIZ_PROJECT_ID }}
    with:
      amd64-builder: "ubuntu-latest-8x"
      dev-versions: "exclude"
      matrix-versions: "exclude"
      temp-registry: "565037064999.dkr.ecr.us-east-2.amazonaws.com/images"
      # Push images only for merges into main and weekly schduled re-builds.
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

  update-helm:
    name: Update Helm
    if: ${{ needs.build.result == 'success' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install bakery
        uses: posit-dev/images-shared/setup-bakery@main

      - name: Get latest version
        id: version
        run: |
          APP_VERSION=$(bakery get version workbench)
          APP_VERSION="${APP_VERSION%%[+-]*}"
          echo "app-version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.WORKBENCH_IDE_RELEASE_APP_ID }}
          private-key: ${{ secrets.WORKBENCH_IDE_RELEASE_PEM }}
          owner: rstudio
          repositories: helm
          permission-actions: write

      - name: Dispatch Helm update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_VERSION: ${{ steps.version.outputs.app-version }}
        run: |
          gh workflow run product-release.yml \
            --repo rstudio/helm \
            --field product=workbench \
            --field version="$APP_VERSION"
