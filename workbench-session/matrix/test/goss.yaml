package:
  {{ $apt_package_list_path := printf "/tmp/version/deps/%s-%s_packages.txt" .Env.IMAGE_OS_NAME .Env.IMAGE_OS_VERSION }}
  {{ $apt_package_list := readFile $apt_package_list_path | splitList "\n" }}
  {{- range $apt_package_list }}
  {{.}}:
    installed: true
  {{end}}
  {{ if eq .Env.IMAGE_VARIANT "Standard" }}

  {{ $apt_optional_package_list_path := printf "/tmp/version/deps/%s-%s_optional_packages.txt" .Env.IMAGE_OS_NAME .Env.IMAGE_OS_VERSION }}
  {{ $apt_optional_package_list := readFile $apt_optional_package_list_path | splitList "\n" }}
  {{- range $apt_optional_package_list }}
  {{.}}:
    installed: true
  {{end}}
  {{ end }}
  quarto:
    installed: true
    versions:
      - {{ .Env.BUILD_ARG_QUARTO_VERSION }}

file:
  python-{{ .Env.BUILD_ARG_PYTHON_VERSION }}:
    exists: true
    path: /opt/python/{{ .Env.BUILD_ARG_PYTHON_VERSION }}
  r-{{ .Env.BUILD_ARG_R_VERSION }}:
    exists: true
    path: /opt/R/{{ .Env.BUILD_ARG_R_VERSION }}
  quarto:
    exists: true
    path: /opt/quarto/bin/quarto
  # TinyTeX is installed under /opt/.TinyTeX; tlmgr path add symlinks binaries into /usr/local/bin.
  /opt/.TinyTeX:
    exists: true
    filetype: directory
  /usr/local/bin/tlmgr:
    exists: true
    filetype: symlink
  /usr/local/bin/pdflatex:
    exists: true
    filetype: symlink
  /opt:
    exists: true
    filetype: directory
  /etc/nsswitch.conf:
    exists: true
    contains:
      - "/^passwd:.*\\bpwb\\b/"
      - "/^group:.*\\bpwb\\b/"
      - "/^shadow:.*\\bpwb\\b/"

command:
  "Verify Jupyter Notebook works":
    exec: "echo '{ \"cells\": [], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 2}' | /opt/python/jupyter/bin/jupyter nbconvert --to notebook --stdin --stdout"
    timeout: 60000
    exit-status: 0
  "Verify R installation is version {{ .Env.BUILD_ARG_R_VERSION }}":
    exec: /opt/R/{{ .Env.BUILD_ARG_R_VERSION }}/bin/R --version
    exit-status: 0
    stdout:
      - "R version {{ .Env.BUILD_ARG_R_VERSION }}"
  "Verify Python installation is version {{ .Env.BUILD_ARG_PYTHON_VERSION }}":
    exec: /opt/python/{{ .Env.BUILD_ARG_PYTHON_VERSION }}/bin/python --version
    exit-status: 0
    stdout:
      - "{{ .Env.BUILD_ARG_PYTHON_VERSION }}"
  "Verify Jupyter installation Python version":
    exec: /opt/python/jupyter/bin/python --version
    exit-status: 0
    stdout:
      - "{{ .Env.BUILD_ARG_PYTHON_VERSION }}"
  "Verify Quarto":
    exec: /usr/local/bin/quarto check
    exit-status: 0
    timeout: 120000
  "Verify Quarto has TinyTeX installed":
    exec: "HOME='/opt' quarto list tools"
    exit-status: 0
    stderr:
      - "/tinytex\\s+Up to date/"
    timeout: 120000
  "Verify TinyTeX is readable and executable by a non-root user":
    exec: su -s /bin/sh -c 'command -v tlmgr && command -v pdflatex && tlmgr --version && pdflatex --version' nobody
    exit-status: 0
    stdout:
      - "tlmgr"
      - "pdfTeX"
  "Verify quarto package is held":
    # Guards against apt upgrade drifting quarto off the pinned version.
    exec: apt-mark showhold
    exit-status: 0
    stdout:
      - "/^quarto$/"
  "Verify /opt files are world-readable":
    exec: 'find /opt -type f -not -perm -004 -print 2>&1 | head -c1 | (! grep -q .)'
    exit-status: 0
  "Verify /opt directories are world-traversable":
    exec: 'find /opt -type d -not -perm -005 -print 2>&1 | head -c1 | (! grep -q .)'
    exit-status: 0
  "Verify libnss_pwb symlink is present for current architecture":
    exec: 'TRIPLET=$(case "$(uname -m)" in x86_64) echo x86_64-linux-gnu ;; aarch64) echo aarch64-linux-gnu ;; *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;; esac) && test -L "/usr/lib/${TRIPLET}/libnss_pwb.so.2"'
    exit-status: 0
